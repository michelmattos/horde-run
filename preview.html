<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Horde Run model preview</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1410; overflow: hidden; font: 13px/1.35 system-ui, -apple-system, sans-serif; color: #fff6e3; }
      #view { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
      #ui { position: fixed; left: 8px; top: 8px; max-width: calc(100vw - 16px); background: rgba(27, 20, 16, 0.78); border-radius: 10px; padding: 8px 10px; }
      #ui a { color: #ffc531; margin-right: 8px; text-decoration: none; }
      #ui a.on { color: #fff; font-weight: 700; text-decoration: underline; }
      #ui .row { margin-top: 4px; }
      #stats { white-space: pre; font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.85; margin-top: 6px; }
      body.bare #ui { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
