<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b1d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <!-- Fetched alongside the script instead of after it: the UI font and the textures the
         first battle waits for behind the loading screen. -->
    <link rel="preload" href="ui/fredoka-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="ui/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="look/bedroom-env.hdr" as="fetch" crossorigin />
    <link rel="preload" href="models/environment-oak-albedo.jpg" as="image" crossorigin />
    <link rel="preload" href="models/environment-oak-normal.jpg" as="image" crossorigin />
    <link rel="preload" href="models/environment-oak-orm.jpg" as="image" crossorigin />
    <title>Horde Run</title>
    <style>
      /* Full screen height for every fixed screen. iOS 26 Home Screen apps (viewport-fit=cover
         with the black-translucent status bar) report 100dvh, 100% and the fixed containing
         block short by the status bar, which left an empty band at the bottom. 100lvh reads the
         whole screen there (no toolbar can collapse in a Home Screen app); the min() guards the
         iOS releases where lvh overshoots instead. --app-under is how far the real bottom edge
         sits below a fixed element's bottom: 0 everywhere but the buggy releases. */
      :root {
        --app-h: 100dvh;
        --app-under: 0px;
      }
      @supports (-webkit-touch-callout: none) {
        @media (display-mode: standalone), (display-mode: fullscreen) {
          :root {
            --app-h: min(100lvh, calc(100dvh + env(safe-area-inset-top, 0px)));
            --app-under: calc(var(--app-h) - 100dvh);
          }
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2b1d12;
        overscroll-behavior: none;
      }
      html {
        height: var(--app-h);
      }
      /* A solid band behind the clock and battery. iOS 26 lays a dark legibility gradient over
         whatever the page draws under the status bar; over this ink band it disappears, so the
         top reads like a native app's status bar. Zero height wherever there is no inset. */
      #status-band {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top, 0px);
        z-index: 60;
        background: #2b1d12;
        pointer-events: none;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        height: var(--app-h);
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        height: var(--app-h);
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background:
          radial-gradient(110% 70% at 50% 45%, rgba(122, 79, 46, 0.35), rgba(30, 16, 6, 0.92)),
          repeating-linear-gradient(90deg, rgba(40, 18, 4, 0.55) 0 2px, transparent 2px 72px),
          repeating-linear-gradient(90deg, #b58250 0 72px, #a87443 72px 144px, #bd8b58 144px 216px, #a97a49 216px 288px);
        font-family:
          ui-rounded,
          'SF Pro Rounded',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #fff6e3;
        opacity: 1;
        transition: opacity 0.25s;
        touch-action: none;
      }
      #loading.out {
        opacity: 0;
        pointer-events: none;
      }
      #loading.failed > * {
        display: none;
      }
      #loading[hidden] {
        display: none;
      }
      #loading .ld-army {
        width: 84px;
        height: 84px;
        margin-bottom: -6px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 4px solid #2b1d12;
        border-radius: 50%;
        background: radial-gradient(80% 70% at 35% 25%, #a5dc84, #4f8f3c 55%, #2f5d27);
        box-shadow:
          inset 0 -5px 0 rgba(0, 0, 0, 0.2),
          0 5px 0 #2b1d12;
        animation: ld-hop 0.9s ease-in-out infinite;
      }
      @keyframes ld-hop {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      #loading .ld-title {
        margin: 0;
        padding: 16px 26px 20px;
        font-size: 40px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0.01em;
        background: linear-gradient(180deg, #7a4f2e 0%, #6a4327 48%, #4a2e1b 100%);
        border: 4px solid #2b1d12;
        border-radius: 22px;
        box-shadow:
          inset 0 3px 0 rgba(255, 225, 180, 0.3),
          inset 0 -5px 0 rgba(0, 0, 0, 0.25),
          0 7px 0 #2b1d12,
          0 18px 24px rgba(0, 0, 0, 0.5);
        text-shadow:
          0 -2px 0 #2b1d12,
          2px 0 0 #2b1d12,
          0 2px 0 #2b1d12,
          -2px 0 0 #2b1d12,
          0 5px 0 #2b1d12;
        transform: rotate(-1.5deg);
      }
      #loading .ld-bar {
        width: 200px;
        height: 22px;
        box-sizing: border-box;
        border: 3.5px solid #2b1d12;
        border-radius: 999px;
        background: repeating-linear-gradient(-45deg, #3fa34d 0 12px, #7cbf5e 12px 24px) 0 0 / 34px 34px;
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.3),
          0 4px 0 #2b1d12;
        animation: ld-roll 0.7s linear infinite;
      }
      @keyframes ld-roll {
        to {
          background-position: 34px 0;
        }
      }
      #loading .ld-text {
        margin: -8px 0 0;
        font-size: 17px;
        font-weight: 700;
        color: #f3dcb0;
        text-shadow: 0 2px 0 #2b1d12;
      }
    </style>
    <script>
      // Boot guard: if the game fails to start (a script that won't load, an error before
      // the first screen, no WebGL), say so on screen instead of leaving an empty page.
      // The card stays short; its Copy report button copies everything known about the
      // failure (device, a WebGL probe, the graphics log of src/core/gpuLog.ts, recent
      // console warnings and errors) as text to paste to whoever debugs it.
      (function () {
        var shown = false;
        var started = Date.now();
        var consoleLines = [];
        function remember(kind, args) {
          try {
            var text = Array.prototype.map
              .call(args, function (a) {
                return a && a.message ? a.message : String(a);
              })
              .join(' ');
            consoleLines.push(new Date().toISOString().slice(11, 19) + ' ' + kind + ': ' + text.slice(0, 1500));
            if (consoleLines.length > 40) consoleLines.shift();
          } catch (e) {
            // never let logging break the page
          }
        }
        ['warn', 'error'].forEach(function (kind) {
          var orig = console[kind];
          console[kind] = function () {
            remember(kind, arguments);
            return orig.apply(console, arguments);
          };
        });
        function read(store, key) {
          try {
            return window[store].getItem(key);
          } catch (e) {
            return '(blocked)';
          }
        }
        // Whether a fresh WebGL context comes back alive right now, then released at once:
        // plain, with the game's power preference, and full-size in the page like the game's.
        function probe(type, attrs, inPage) {
          var c = document.createElement('canvas');
          try {
            if (inPage) {
              c.width = Math.round(innerWidth * Math.min(devicePixelRatio, 1.5));
              c.height = Math.round(innerHeight * Math.min(devicePixelRatio, 1.5));
              c.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none';
              document.body.appendChild(c);
            }
            var gl = c.getContext(type, attrs);
            if (!gl) return 'no context';
            var lost = gl.isContextLost();
            var ext = gl.getExtension('WEBGL_lose_context');
            if (ext && !lost) ext.loseContext();
            return lost ? 'lost' : 'ok';
          } catch (e) {
            return 'threw ' + e;
          } finally {
            c.remove();
          }
        }
        function report(text) {
          var log = [];
          try {
            log = JSON.parse(localStorage.getItem('horde-run:gpu-log') || '[]');
          } catch (e) {
            log = [];
          }
          var standalone =
            navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
          return [
            'Horde Run error report (for an AI agent or developer debugging the game).',
            'Game: Horde Run, a Babylon.js 9 WebGL phone game, https://github.com/michelmattos/horde-run',
            '(start-up and recovery: src/main.ts and src/core/recovery.ts; graphics log: src/core/gpuLog.ts).',
            '',
            'Error shown:',
            text,
            '',
            'When: ' + new Date().toString() + ', page open ' + Math.round((Date.now() - started) / 1000) + ' s',
            'Page: ' + location.href,
            'Agent: ' + navigator.userAgent,
            'Screen: ' + innerWidth + 'x' + innerHeight + ' css px, pixel ratio ' + devicePixelRatio,
            'Home Screen app: ' + standalone,
            'Service worker controls page: ' + !!(navigator.serviceWorker && navigator.serviceWorker.controller),
            'WebGL probe now: webgl2 ' +
              probe('webgl2') +
              ', webgl ' +
              probe('webgl') +
              ', webgl2 high-performance ' +
              probe('webgl2', { powerPreference: 'high-performance' }) +
              ', webgl2 high-performance full-size in page ' +
              probe('webgl2', { powerPreference: 'high-performance', antialias: false, stencil: false }, true),
            'Start-up choice that worked last: ' + read('localStorage', 'horde-run:gl-boot'),
            'Recovery state (this tab): ' + read('sessionStorage', 'horde-run:gpu-recovery'),
            'Render settings: ' + read('localStorage', 'horde-run:render-v1'),
            '',
            'Graphics log (newest last):',
            log.length
              ? log
                  .map(function (e) {
                    return new Date(e.at).toISOString() + ' ' + e.event + ': ' + e.detail;
                  })
                  .join('\n')
              : '(empty)',
            '',
            'Console warnings and errors (newest last):',
            consoleLines.length ? consoleLines.join('\n') : '(none)',
          ].join('\n');
        }
        function copy(text, done) {
          function fallback() {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, text.length);
            var ok = false;
            try {
              ok = document.execCommand('copy');
            } catch (e) {
              ok = false;
            }
            ta.remove();
            done(ok);
          }
          if (navigator.clipboard && navigator.clipboard.writeText)
            navigator.clipboard.writeText(text).then(function () {
              done(true);
            }, fallback);
          else fallback();
        }
        function button(label) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          b.setAttribute(
            'style',
            'font:600 15px/1 -apple-system,system-ui,sans-serif;padding:11px 16px;margin:14px 8px 0 0;border-radius:10px;' +
              'border:2px solid #3b2a1a;background:#fff;color:#3b2a1a',
          );
          return b;
        }
        function show(msg, title) {
          if (shown || (!title && window.__hordeBooted)) return;
          shown = true;
          var text = (title || 'Horde Run could not start.') + '\n\n' + msg;
          // Stop promising progress: the loading screen keeps only its background.
          var ld = document.getElementById('loading');
          if (ld) ld.className = 'failed';
          var d = document.createElement('div');
          d.id = 'boot-error';
          d.setAttribute(
            'style',
            'position:fixed;left:16px;right:16px;top:30%;padding:16px;border-radius:12px;background:#fff8e7;' +
              'color:#3b2a1a;font:15px/1.4 -apple-system,system-ui,sans-serif;z-index:99;white-space:pre-wrap;' +
              'max-height:60%;overflow:auto',
          );
          var p = document.createElement('div');
          p.textContent = text;
          var copyBtn = button('Copy report');
          copyBtn.dataset.action = 'copy-report';
          copyBtn.onclick = function () {
            var r = report(text);
            window.__hordeReport = r; // the smoke test reads what was copied
            copy(r, function (ok) {
              copyBtn.textContent = ok ? 'Copied' : 'Copy failed';
            });
          };
          // A fresh start: forget this tab's recent losses so the game gets its full retries.
          var retry = button('Try again');
          retry.onclick = function () {
            try {
              sessionStorage.removeItem('horde-run:gpu-recovery');
            } catch (e) {
              // blocked storage: reload anyway
            }
            location.reload();
          };
          d.append(p, copyBtn, retry);
          (document.body || document.documentElement).appendChild(d);
        }
        window.__hordeBootError = function (msg) {
          show(msg);
        };
        // Also after boot (the graphics gave up for good).
        window.__hordeFatal = function (msg) {
          show(msg, 'The graphics stopped working.');
        };
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            // A missing image or font is not fatal; a script that will not load is.
            if (t && t !== window && t.tagName && t.tagName !== 'SCRIPT') return;
            remember('uncaught', [
              (e.message || 'Could not load ' + ((t && (t.src || t.href)) || 'a file')) +
                (e.error && e.error.stack ? '\n' + e.error.stack : ''),
            ]);
            show(e.message || 'Could not load ' + ((t && (t.src || t.href)) || 'a file') + '.');
          },
          true,
        );
        addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          remember('unhandled rejection', [String((r && r.message) || r) + (r && r.stack ? '\n' + r.stack : '')]);
          show(String((r && r.message) || r));
        });
        setTimeout(function () {
          show('Loading took too long. Check the connection and open the game again.');
        }, 20000);
      })();
    </script>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <div id="status-band" aria-hidden="true"></div>
    <!-- Covers the page until the first screen (and, for a battle, its 3D scene) is ready;
         src/ui/loading.ts shows it again while a battle loads. -->
    <div id="loading" role="status" aria-label="Loading">
      <div class="ld-army">
        <svg viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
          <g fill="#2b1d12" stroke="#2b1d12" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 15 C21 4 41 4 40.5 15 Z" stroke-width="7.2" />
            <path d="M18.5 15 L43.5 15" stroke-width="8.7" />
            <path d="M31 20 L31 21" stroke-width="14.2" />
            <path d="M31 26 L31 39" stroke-width="17.7" />
            <path d="M29 40 L25.5 56 L20.5 56.5" stroke-width="12.2" />
            <path d="M33.5 40 L38 56 L43 56" stroke-width="12.2" />
            <path d="M17 45 L49 15" stroke-width="9.7" />
            <path d="M27 27 L27 34 L38 30" stroke-width="10.2" />
          </g>
          <g fill="#fff6e3" stroke="#fff6e3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 15 C21 4 41 4 40.5 15 Z" stroke-width="2" />
            <path d="M18.5 15 L43.5 15" stroke-width="3.5" />
            <path d="M31 20 L31 21" stroke-width="9" />
            <path d="M31 26 L31 39" stroke-width="12.5" />
            <path d="M29 40 L25.5 56 L20.5 56.5" stroke-width="7" />
            <path d="M33.5 40 L38 56 L43 56" stroke-width="7" />
            <path d="M17 45 L49 15" stroke-width="4.5" />
            <path d="M27 27 L27 34 L38 30" stroke-width="5" />
          </g>
        </svg>
      </div>
      <h1 class="ld-title">Horde Run</h1>
      <div class="ld-bar"></div>
      <p class="ld-text">Loading…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
