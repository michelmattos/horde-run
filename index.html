<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2433" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Horde Run</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2433;
        overscroll-behavior: none;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        height: 100dvh;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
    <script>
      // Boot guard: if the game fails to start (a script that won't load, an error before
      // the first screen, no WebGL), say so on screen instead of leaving an empty page.
      (function () {
        var shown = false;
        function show(msg, title) {
          if (shown || (!title && window.__hordeBooted)) return;
          shown = true;
          var d = document.createElement('div');
          d.id = 'boot-error';
          d.setAttribute(
            'style',
            'position:fixed;left:16px;right:16px;top:30%;padding:16px;border-radius:12px;background:#fff8e7;' +
              'color:#3b2a1a;font:15px/1.4 -apple-system,system-ui,sans-serif;z-index:99;white-space:pre-wrap',
          );
          d.textContent = (title || 'Horde Run could not start.') + '\n\n' + msg;
          (document.body || document.documentElement).appendChild(d);
        }
        window.__hordeBootError = function (msg) {
          show(msg);
        };
        // Also after boot (the graphics gave up for good).
        window.__hordeFatal = function (msg) {
          show(msg, 'The graphics stopped working.');
        };
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            // A missing image or font is not fatal; a script that will not load is.
            if (t && t !== window && t.tagName && t.tagName !== 'SCRIPT') return;
            show(e.message || 'Could not load ' + ((t && (t.src || t.href)) || 'a file') + '.');
          },
          true,
        );
        addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show(String((r && r.message) || r));
        });
        setTimeout(function () {
          show('Loading took too long. Check the connection and open the game again.');
        }, 20000);
      })();
    </script>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
