name: CI

# Required checks for merging into main: "checks" (typecheck, lint, format, unit tests)
# and "smoke" (production build played in a headless phone-sized browser).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # The three smoke scenarios boot the real game under software GL, so they run as parallel
  # jobs. The "smoke" job below waits for all of them and is the one to require.
  smoke-scenario:
    name: smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [campaign, boss, expedition]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Smoke test
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          SMOKE=${{ matrix.scenario }} npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-${{ matrix.scenario }}
          path: smoke-*.png
          if-no-files-found: ignore

  smoke:
    needs: smoke-scenario
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.smoke-scenario.result }}" = success
